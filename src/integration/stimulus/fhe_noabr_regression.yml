# SPDX-License-Identifier: Apache-2.0
#
# FHE NoABR regression list (C'-era). The tape-out anchor is NoABR, so this
# curated list builds the SoC with CALIPTRA_NO_ADAMS_BRIDGE + FHE_WALKER and
# runs the L0 tests that pass on that config, plus the FHE accelerator tests.
# Run: BUILD=fhe_noabr tools/scripts/run_vcs_l0_regression.sh
#
# EXCLUDED (vs base L0), with reason:
#   ML-DSA / ML-KEM (need Adams Bridge, compiled out): smoke_test_kv_mldsa,
#     smoke_test_mldsa_edge, smoke_test_mldsa_zeroize, smoke_test_mlkem,
#     smoke_test_mlkem_kv, smoke_test_mlkem_locked_api, smoke_test_mlkem_shared_key
#   ABR-dependent by behavior (hang waiting for MLDSA status under NoABR):
#     smoke_test_kv_doe, smoke_test_doe_scan
#   Pre-existing failures (fail on default + ABR-FHE + NoABR alike -- *_NOT_STABLE
#     assertions, a tree issue unrelated to FHE/NoABR; track separately):
#     pv_hash_zeroize, smoke_test_hmac, smoke_test_pcr_zeroize
#   Already disabled in base L0 (commented out): smoke_test_kv_ecdh_flow, smoke_test_dma_aes_kv
document:
  schema: 1.0

contents:
  - tests:
      tags: ["L0_noabr", "fhe"]
      paths:
        # ---- FHE accelerator tests ----
        - ../test_suites/smoke_test_fhe/smoke_test_fhe.yml
        - ../test_suites/smoke_test_kv_fhe/smoke_test_kv_fhe.yml
